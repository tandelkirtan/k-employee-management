<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
    <link rel="stylesheet" href="employee.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen&family=Smooch&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>


<body>
    <!-- Employe Management System, using CRUD + Events -->
    <!-- CRUD == Creation + Read + Update and Deletion -->


    <!------------------add popup---------------- -->
    <div class="add-popup hide" id="pop">
        <div class="popup-details">
            <!-- <i id="close-icon" class="fa-regular fa-circle-xmark text-white"></i> -->
            <span id="close-icon" class="material-symbols-outlined">close</span>
            <h2 class="text-center">Enter Employee Details</h2>
            <form id="form" class="form1">
                <div>
                    <label for="name">Employee Name</label>
                    <input class="nameinput" id="name" type="text" placeholder="Enter your Name" name="name" required>
                </div>
                <div>
                    <label for="email">Employee Email Id</label>
                    <input id="email" type="email" placeholder="Enter your Mail Id" name="email" required>
                </div>
                <div>
                    <label for="role">Employee Role</label>
                    <select name="role" id="role" name="role" required>
                        <option value="SDE">SDE</option>
                        <option value="designer">Designer</option>
                        <option value="developer">Developer</option>
                        <option value="Editor">Editor</option>
                        <option value="intern">Intern</option>
                    </select>
                </div>
                <div>
                    <label for="doj">Date of Joining</label>
                    <input id="doj" type="date" name="date" required>
                </div>
                <div>
                    Employee Gender
                    <input type="radio" name="gender" value="male" id="male">
                    <label for="male">Male</label>
                    <input type="radio" name="gender" value="female" id="female">
                    <label for="female">Female</label>
                    <input id="Other" type="radio" name="gender" value="Other">
                    <label for="Other">Other</label>
                </div>
                <div class="d-flex justify-content-center">
                    <input id="formsumbit" type="submit">
                </div>
            </form>
        </div>
    </div>
    <!------------------add popup---------------- -->

    <!------------------edit popup---------------- -->

    <div class="add-popup hide" id="editpop">
        <div class="popup-details">
            <span id="close-icon-edit" class="material-symbols-outlined">close</span>
            <h2 class="text-center">Edit details</h2>
            <form id="form" class="preform forrm2">
                <div>
                    <label for="name">Employee Name</label>
                    <input id="name" type="text" placeholder="Enter your Name" name="name" required>
                </div>
                <div>
                    <label for="email">Employee Email Id</label>
                    <input id="email" type="email" placeholder="Enter your Mail Id" name="email" required>
                </div>
                <div>
                    <label for="role">Employee Role</label>
                    <select name="role" id="role" name="role" required>
                        <option value="SDE">SDE</option>
                        <option value="designer">Designer</option>
                        <option value="developer">Developer</option>
                        <option value="Editor">Editor</option>
                        <option value="intern">Intern</option>
                    </select>
                </div>
                <div>
                    <label for="doj">Date of Joining</label>
                    <input id="doj" type="date" name="date" required>
                </div>
                <div>
                    Employee Gender
                    <input type="radio" name="gender" value="male" id="upmale">
                    <label for="upmale">Male</label>
                    <input type="radio" name="gender" value="female" id="upfemale">
                    <label for="upfemale">Female</label>
                    <input id="upOther" type="radio" name="gender" value="Other">
                    <label for="upOther">Other</label>
                </div>
                <div class="d-flex justify-content-center">
                    <input id="formsumbit" type="submit">
                </div>
            </form>
        </div>
    </div>

    <!------------------edit popup---------------- -->


    <div id="background" class="background">
        <div class="heading">
            <h1>Welcome to Kirtandel's Employee Management System</h1>
        </div>
        <div class="heading">
            <h1 id="add-button">Add Employee</h1>
        </div>

        <!-- ------------table------------------ -->
        <div class="table-container">
            <table class="employee-list" id="employee-list">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Employee Id</th>
                        <th>Role</th>
                        <th>Date of Joining</th>
                        <th>Gender</th>
                        <th>Options</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                </tbody>
                <tbody></tbody>
            </table>
        </div>
        
        <div class="footer">
            <p>
                Powered by
                <a href="https://kirtandel.vercel.app/" target="_blank">kirtandel</a>
            </p>
        </div>
    </div>


    <script src="employee.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
        integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
        crossorigin="anonymous"></script>
</body>

</html>
